services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: perugol
      POSTGRES_USER: perugol
      POSTGRES_PASSWORD: perugol-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - perugol-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perugol -d perugol"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  perugol-db:
